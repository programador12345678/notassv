<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: #e2e8f0; --accent: #4f46e5; }
        .dark-mode { --bg: #020617; --card: #0f172a; --text: #f8fafc; --border: #1e293b; --accent: #6366f1; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.4s; min-height: 100vh; }
        .glass { background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(15px); }
        
        /* Adaptabilidad de Tabla */
        @media (max-width: 768px) {
            thead { display: none; }
            tr { display: block; margin-bottom: 1rem; padding: 1rem; border: 1px solid var(--border); border-radius: 1.5rem; background: var(--card); }
            td { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0 !important; border: none !important; }
            td::before { content: attr(data-label); font-weight: bold; color: var(--accent); margin-right: 10px; }
        }

        .btn-primary { background: var(--accent); color: white; transition: 0.3s; font-weight: 700; border-radius: 12px; }
        .btn-secondary { background: #e2e8f0; color: #475569; border-radius: 12px; font-size: 0.75rem; padding: 8px; }
        input, select { background: var(--bg) !important; border: 1px solid var(--border) !important; color: var(--text) !important; border-radius: 12px; padding: 10px; width: 100%; outline: none; }
        
        /* Animación de carga */
        .loading { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body class="light">

    <nav class="fixed top-4 right-4 z-[110] flex gap-2">
        <button onclick="toggleModal('custom-menu')" class="glass p-3 rounded-full shadow-lg">⚙️</button>
        <button id="logout-btn" onclick="logout()" class="hidden bg-red-500 text-white px-6 py-3 rounded-full font-bold shadow-lg lang" data-es="Salir" data-en="Logout">Salir</button>
    </nav>

    <div id="custom-menu" class="fixed top-20 right-4 w-48 glass rounded-2xl shadow-2xl p-4 hidden z-[120]">
        <select onchange="setTheme(this.value)" id="theme-sel" class="mb-2">
            <option value="light">☀️ Light</option>
            <option value="dark">🌙 Dark</option>
        </select>
        <select onchange="setLang(this.value)" id="lang-sel">
            <option value="es">Español</option>
            <option value="en">English</option>
        </select>
    </div>

    <div id="login-sec" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] shadow-2xl w-full max-w-sm text-center">
            <h1 class="text-2xl font-black text-indigo-600 mb-6 italic lang" data-es="Sistema de Notas" data-en="Notes System">Sistema de Notas</h1>
            
            <div id="login-form">
                <input type="text" id="user-in" placeholder="Usuario" class="mb-3 text-center">
                <input type="password" id="pass-in" placeholder="Contraseña" class="mb-4 text-center">
                <button onclick="login()" id="btn-login-text" class="w-full btn-primary py-4 text-lg lang" data-es="Entrar" data-en="Sign In">Entrar</button>
                
                <p id="err" class="text-red-500 mt-4 text-xs font-bold hidden lang" data-es="Error de acceso" data-en="Access Denied">Error de acceso</p>
                
                <div id="recovery-options" class="mt-6 flex flex-col gap-2 hidden">
                    <button onclick="showRecover('user')" class="btn-secondary lang" data-es="Olvidé mi usuario" data-en="Forgot username">Olvidé mi usuario</button>
                    <button onclick="showRecover('pass')" class="btn-secondary lang" data-es="Olvidé mi contraseña" data-en="Forgot password">Olvidé mi contraseña</button>
                </div>
            </div>

            <div id="recover-ui" class="hidden">
                <h3 id="recover-title" class="font-bold mb-4 text-sm"></h3>
                <input type="text" id="recover-input" class="mb-4 text-center">
                <button onclick="processRecovery()" class="w-full btn-primary py-3 mb-2 lang" data-es="Enviar" data-en="Send">Enviar</button>
                <button onclick="cancelRecover()" class="text-xs opacity-50 font-bold lang" data-es="Volver" data-en="Back">Volver</button>
            </div>
        </div>
    </div>

    <div id="sys-sec" class="hidden p-4 md:p-12">
        <main class="max-w-6xl mx-auto">
            <div class="glass rounded-[2rem] shadow-2xl overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-indigo-600 text-white">
                        <tr>
                            <th class="p-4 lang" data-es="Materia" data-en="Subject">Materia</th>
                            <th class="p-4">Coti.</th>
                            <th class="p-4">Inte.</th>
                            <th class="p-4">Examen</th>
                            <th class="p-4 text-right lang" data-es="Final" data-en="Final">Final</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y dark:divide-white/5"></tbody>
                </table>
            </div>
            <p id="sync-status" class="text-center mt-4 text-xs opacity-50"></p>
        </main>
    </div>

    <script>
        // URL DE TU GOOGLE APPS SCRIPT INTEGRADA
        const API_URL = "https://script.google.com/macros/s/AKfycbxJLskf_F-HV1kLN5CbvQO50Pzxzs7nagEJCm8JuDhmv0g-Ck9YP8WaHMCFL0lJPbm6/exec"; 
        
        let allData = [];
        let userAct = null;
        let recoveryMode = '';

        // Cargar datos desde Google Sheets
        async function loadSheetsData() {
            try {
                const resp = await fetch(API_URL);
                allData = await resp.json();
            } catch (e) {
                console.error("Error cargando datos:", e);
            }
        }

        // Proceso de Login
        async function login() {
            const btn = document.getElementById('btn-login-text');
            btn.innerText = "...";
            btn.classList.add('loading');

            await loadSheetsData();
            
            const u = document.getElementById('user-in').value;
            const p = document.getElementById('pass-in').value;
            
            // Buscar usuario en los datos traídos de Sheets
            const user = allData.find(x => x.usuario == u && x.pass == p);

            if (user) {
                userAct = user;
                document.getElementById('login-sec').classList.add('hidden');
                document.getElementById('sys-sec').classList.remove('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
                renderTable();
            } else {
                document.getElementById('err').classList.remove('hidden');
                document.getElementById('recovery-options').classList.remove('hidden');
                btn.innerText = "Entrar";
                btn.classList.remove('loading');
            }
        }

        // Dibujar la tabla con los datos del usuario logueado
        function renderTable() {
            const body = document.getElementById('table-body');
            const l = localStorage.getItem('lang') || 'es';
            
            // Filtramos solo las materias de este usuario
            const myMats = allData.filter(x => x.usuario === userAct.usuario);
            
            body.innerHTML = myMats.map(m => {
                const n1 = parseFloat(m.coti) || 0;
                const n2 = parseFloat(m.inte) || 0;
                const n3 = parseFloat(m.exam) || 0;
                const final = (n1 + n2 + n3) / 3;

                return `
                <tr class="hover:bg-indigo-50/50 dark:hover:bg-white/5 transition">
                    <td data-label="${l==='es'?'Materia':'Subject'}" class="p-4 font-bold text-indigo-60
