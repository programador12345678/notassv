<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas | 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: #e2e8f0; --accent: #4f46e5; }
        .dark-mode { --bg: #020617; --card: #0f172a; --text: #f8fafc; --border: #1e293b; --accent: #6366f1; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.4s; min-height: 100vh; display: flex; flex-direction: column; }
        .glass { background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(15px); padding: 2rem; border-radius: 2rem; }
        .hidden { display: none !important; }
        input { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 12px; width: 100%; outline: none; margin-bottom: 1rem; }
        .btn-primary { background: var(--accent); color: white; transition: 0.3s; font-weight: 700; border-radius: 12px; width: 100%; padding: 12px; }
        .btn-primary:hover { transform: translateY(-2px); opacity: 0.9; }
    </style>
</head>
<body class="light">

    <div id="login-sec" class="min-h-screen flex items-center justify-center p-6">
        <div class="glass shadow-2xl w-full max-w-sm text-center">
            <h1 class="text-3xl font-black text-indigo-600 mb-8 italic">Sistema de Notas</h1>
            <input type="text" id="user-in" placeholder="Usuario (admin.notas)">
            <input type="password" id="pass-in" placeholder="Contraseña (Admin2026.)">
            <button onclick="loginLocal()" class="btn-primary text-lg">Entrar Ahora</button>
            <p id="err" class="text-red-500 mt-4 text-xs font-bold"></p>
        </div>
    </div>

    <div id="sys-sec" class="hidden p-6">
        <nav class="flex justify-between items-center max-w-6xl mx-auto mb-10">
            <h2 id="welcome-msg" class="text-2xl font-bold text-indigo-600"></h2>
            <button onclick="logout()" class="bg-red-500 text-white px-6 py-2 rounded-full font-bold">Salir</button>
        </nav>

        <main class="max-w-6xl mx-auto">
            <div class="glass shadow-xl overflow-hidden p-0">
                <table class="w-full text-left">
                    <thead class="bg-indigo-600 text-white">
                        <tr>
                            <th class="p-4">Materia</th>
                            <th class="p-4">Coti.</th>
                            <th class="p-4">Inte.</th>
                            <th class="p-4">Exam.</th>
                            <th class="p-4 text-right">Final</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-200">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        // DATOS INTEGRADOS (Lo que antes pedías a la API)
        const DATABASE = {
            "admin.notas": {
                pass: "Admin2026.",
                rol: "admin",
                access: "both",
                name: "Administrador",
                mats: ["Matemáticas", "Ciencias", "Lenguaje"]
            }
        };

        function loginLocal() {
            const u = document.getElementById('user-in').value.trim().toLowerCase();
            const p = document.getElementById('pass-in').value.trim();
            const err = document.getElementById('err');

            if (DATABASE[u] && DATABASE[u].pass === p) {
                const userData = DATABASE[u];
                localStorage.setItem('session', JSON.stringify(userData));
                showSystem(userData);
            } else {
                err.innerText = "Credenciales incorrectas. Prueba admin.notas / Admin2026.";
            }
        }

        function showSystem(user) {
            document.getElementById('login-sec').classList.add('hidden');
            document.getElementById('sys-sec').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = "Bienvenido, " + user.name;
            
            const body = document.getElementById('table-body');
            body.innerHTML = user.mats.map(m => `
                <tr class="hover:bg-gray-50">
                    <td class="p-4 font-bold text-indigo-600">${m}</td>
                    <td class="p-4" contenteditable="true">10</td>
                    <td class="p-4" contenteditable="true">10</td>
                    <td class="p-4" contenteditable="true">10</td>
                    <td class="p-4 text-right font-black text-indigo-600">10.0</td>
                </tr>
            `).join('');
        }

        function logout() {
            localStorage.removeItem('session');
            location.reload();
        }

        // Auto-login si ya hay sesión
        window.onload = () => {
            const session = localStorage.getItem('session');
            if (session) showSystem(JSON.parse(session));
        };
    </script>
</body>
</html>
